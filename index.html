<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Math Arcade Monopoly</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <!-- PANTALLA 1: LOBBY PARA REGISTRO -->
    <div id="lobby" class="screen active">
        <div class="card">
            <h1>🎮 Math Monopoly 3D</h1>
            <p style="margin-bottom: 15px; font-size: 13px; color: #64748b;">Estructuras, Funciones y Gráficas</p>
            <input type="text" id="playerName" placeholder="Ingresa tu Nickname..." autocomplete="off">
            <button id="btnJoin">¡Unirse a la Partida!</button>
        </div>
    </div>

    <!-- PANTALLA 2: ESPERA AL ADMINISTRADOR -->
    <div id="waiting" class="screen">
        <div class="card">
            <h2>⏳ Esperando al Administrador...</h2>
            <p>La partida iniciará tan pronto como el admin la active.</p>
        </div>
    </div>

    <!-- PANTALLA 3: TABLERO PRINCIPAL DE JUEGO -->
    <div id="game" class="screen">
        <div class="header">
            <!-- 🆕 "24" fijo -> displayTotal, que game.js llena con BOARD_SIZE en buildBoard() -->
            <span id="displayName"></span> | Casilla: <span id="displayPos">0</span>/<span id="displayTotal">24</span>
        </div>
        <div id="boardContainer" class="board-container">
            <div id="board" class="board"></div>
            
            <!-- CENTRO CON UN SOLO DADO 3D -->
            <div class="center-area">
                <div class="scene-dice">
                    <div id="cube" class="cube">
                        <div class="cube-face face-1"><div class="dot" style="grid-area: 2/2;"></div></div>
                        <div class="cube-face face-2"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
                        <div class="cube-face face-3"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 2/2;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
                        <div class="cube-face face-4"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
                        <div class="cube-face face-5"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 2/2;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
                        <div class="cube-face face-6"><div class="dot" style="grid-area: 1/1;"></div><div class="dot" style="grid-area: 1/3;"></div><div class="dot" style="grid-area: 2/1;"></div><div class="dot" style="grid-area: 2/3;"></div><div class="dot" style="grid-area: 3/1;"></div><div class="dot" style="grid-area: 3/3;"></div></div>
                    </div>
                </div>
                <button id="btnRoll" disabled>Lanzar Dado 3D</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE PREGUNTA CON ANIMACIÓN FLIP CARD -->
    <div id="modalQuestion" class="modal">
        <div class="flip-card-inner">
            <div class="flip-card-front card">
                <h3 id="qText">Pregunta</h3>
                <img id="qMainImg" class="main-q-img" style="display:none;" src="" alt="Gráfica">
                <div id="qOptions" class="options-container"></div>
            </div>
        </div>
    </div>

    <!-- MODAL DE CARTA SORPRESA -->
    <div id="modalSurprise" class="modal">
        <div class="flip-card-inner">
            <div class="flip-card-front card" style="border-color: var(--neon-yellow);">
                <h2 style="color: var(--neon-yellow);">🎁 ¡CARTA SORPRESA!</h2>
                <p id="surpriseText" style="font-size: 16px; margin: 20px 0; font-weight: bold;"></p>
                <button id="btnSurpriseContinue">Aceptar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE RESULTADO / PENALIZACIÓN -->
    <div id="modalResult" class="modal">
        <div class="flip-card-inner">
            <div class="flip-card-front card">
                <h2 id="resultText">Resultado</h2>
                <button id="btnContinue" style="margin-top: 15px;">Continuar</button>
            </div>
        </div>
    </div>

    <!-- MODAL DE GANADOR -->
    <div id="modalWinner" class="modal">
        <div class="card" style="border-color: var(--neon-green);">
            <h2 style="color: var(--neon-green);">🏆 ¡VICTORIA TOTAL!</h2>
            <p>¡Llegaste a la meta con éxito!</p>
        </div>
    </div>

    <script type="module" src="js/game.js"></script>
</body>
</html>
